<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#291913">
  <title>摸一摸你的心肝</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #efc27c;
      --ink: #2f1b12;
      --gold: #f9d698;
      --soft: #dec09a;
      --line: #ebbc792e;
      --bg-high: #513021;
      --bg-mid: #332018;
      --bg-low: #221510;
      --ring: var(--accent);
      --ring-soft: #eabb7936;
      --ring-faint: #eabb7921;
      --button-top: #ffe0a5;
      --button-bottom: #edba74;
      --button-border: #ffdfa2;
      --progress-track: #644431;
      --progress-start: #cf874f;
      --progress-end: #ffda92;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--gold);
      background: radial-gradient(ellipse at 50% 22%, var(--bg-high) 0%, var(--bg-mid) 48%, var(--bg-low) 100%) fixed;
      font: 15px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 2px solid #ffe6ad; outline-offset: 4px; }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }
    .page {
      width: min(100%, 450px);
      margin: 0 auto;
      padding: 17px 23px 26px;
      padding-top: max(17px, env(safe-area-inset-top));
      padding-bottom: max(26px, env(safe-area-inset-bottom));
    }
    .top { display: flex; align-items: center; justify-content: flex-end; }
    .mark, .sound { display: inline-flex; align-items: center; gap: 7px; }
    .mark::after { content: ""; width: 26px; height: 1px; background: #d1a36370; }
    .mark svg { width: 17px; height: 17px; color: #dfa766; }
    .sound {
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--gold);
      background: #26160f66;
      font-size: 12px;
    }
    .sound svg { width: 15px; height: 15px; }
    .sound .slash, .sound[data-off] .waves { display: none; }
    .sound[data-off] .slash { display: initial; }
    .hero { text-align: center; }
    h1, h2, p { margin: 0; }
    h1 {
      margin-top: 17px;
      font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      font-size: clamp(27px, 8.2vw, 37px);
      line-height: 1.3;
      letter-spacing: .05em;
      color: #ffe3ad;
    }
    .intro { margin-top: 7px; color: var(--soft); font-size: 13px; letter-spacing: .08em; }
    .stage {
      --diameter: min(86vw, 404px);
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      height: calc(var(--diameter) + 54px);
      margin: 9px 0 2px;
      z-index: 2;
    }
    .stage::before, .stage::after {
      position: absolute;
      z-index: -1;
      width: calc(var(--diameter) + 10px);
      aspect-ratio: 1;
      border: 1px solid var(--ring-soft);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .stage::after {
      width: calc(var(--diameter) + 22px);
      border-color: var(--ring-faint);
      border-style: dashed;
    }
    .sparkles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .pet {
      position: relative;
      display: block;
      width: var(--diameter);
      height: var(--diameter);
      padding: 5px;
      border: 1px solid var(--ring);
      border-radius: 50%;
      background: #825134;
      box-shadow: 0 12px 30px #180c0875, 0 0 23px #ffc77d29;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .face, .photo {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }
    .photo-frame { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
    .photo {
      position: absolute;
      inset: 0;
      border-radius: 0;
      transform: translate(var(--photo-x, 0%), var(--photo-y, 0%)) scale(var(--photo-scale, 1));
    }
    .pet:has(.photo:not([hidden])) .face { display: none !important; }
    .stage[data-cutout]::before { display: none; }
    .oshi-tip { display: none; margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--soft); }
    body[data-skin="oshi"] .oshi-tip { display: block; }
    .hand {
      position: absolute;
      z-index: 2;
      top: -26px;
      left: 50%;
      width: 132px;
      height: auto;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 4px 5px #28150d60);
    }
    .stage.patting .hand { animation: pat .88s cubic-bezier(.42, 0, .22, 1) both; }
    .stage.patting .pet { animation: squash .88s cubic-bezier(.42, 0, .28, 1) both; }
    @keyframes pat {
      0% { opacity: 0; transform: translate(-22%, -24px) rotate(9deg); }
      17% { opacity: .94; }
      42%, 64% { opacity: 1; transform: translate(-29%, 1px) rotate(-4deg); }
      100% { opacity: 0; transform: translate(-21%, -25px) rotate(9deg); }
    }
    @keyframes squash {
      0%, 32%, 100% { transform: scale(1); }
      50%, 61% { transform: scale(1.018, .956); }
      83% { transform: scale(.997, 1.008); }
    }
    .float {
      position: absolute;
      z-index: 3;
      top: 38%;
      left: 50%;
      color: #ffbdab;
      font-size: 23px;
      font-weight: 700;
      text-shadow: 0 2px 8px #31140dcc;
      pointer-events: none;
      animation: float-up .72s ease-out both;
    }
    @keyframes float-up {
      0% { opacity: 0; transform: translate(40px, 5px) scale(.75); }
      21% { opacity: 1; }
      100% { opacity: 0; transform: translate(68px, -68px) scale(1.1); }
    }
    .actions { display: flex; justify-content: center; gap: 9px; }
    .action {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--gold);
      background: #2f1d16;
      font-size: 13px;
      font-weight: 650;
    }
    .action svg { width: 17px; height: 17px; flex: none; }
    .primary { border-color: var(--button-border); color: var(--ink); background: linear-gradient(var(--button-top), var(--button-bottom)); }
    .action:active, .sound:active { transform: translateY(1px); }
    .status { margin-top: 7px; color: #ffc3b5; font-size: 12px; overflow-wrap: anywhere; }
    .card {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #2517108c;
      box-shadow: 0 8px 24px #190e0b24;
    }
    .stats { margin-top: 22px; padding: 14px 16px 13px; }
    .stats-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tally { display: flex; align-items: baseline; gap: 9px; }
    .count { color: #ffdfa3; font: 700 30px/1 Georgia, serif; font-variant-numeric: tabular-nums; }
    .today-count { margin-top: 4px; }
    .caption { color: var(--soft); font-size: 12px; }
    .title {
      flex: none;
      padding: 4px 11px;
      border: 1px solid #ebb76c40;
      border-radius: 99px;
      background: #ab733929;
      font-size: 12px;
      font-weight: 650;
    }
    progress {
      display: block;
      width: 100%;
      height: 6px;
      margin: 13px 0 7px;
      overflow: hidden;
      border: 0;
      border-radius: 99px;
      appearance: none;
      background: var(--progress-track);
      color: #f4c782;
    }
    progress::-webkit-progress-bar { background: var(--progress-track); border-radius: 99px; }
    progress::-webkit-progress-value { background: linear-gradient(90deg, var(--progress-start), var(--progress-end)); border-radius: 99px; }
    progress::-moz-progress-bar { background: linear-gradient(90deg, var(--progress-start), var(--progress-end)); border-radius: 99px; }
    .fortune { margin-top: 11px; padding: 11px 13px; }
    .fortune-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .fortune h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .fortune h2 svg { width: 28px; height: 28px; padding: 5px; color: #f6c581; background: #98703f36; border-radius: 8px; }
    .draw { min-height: 36px; padding: 5px 11px; background: #ab733929; }
    .draw:disabled { color: var(--soft); }
    .wish { margin: 9px 2px 1px; padding: 9px 2px 1px; border-top: 1px solid var(--line); color: #ffe1a9; font-size: 13px; }
    .fortune-actions, .quote-actions { display: flex; align-items: center; gap: 7px; }
    .quote-editor { margin: 10px 2px 1px; padding-top: 10px; border-top: 1px solid var(--line); }
    .quote-editor label { display: block; margin-bottom: 5px; font-size: 13px; }
    .quote-editor textarea {
      display: block;
      width: 100%;
      min-height: 106px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--gold);
      background: #100b1080;
      font: inherit;
      font-size: 16px;
      resize: vertical;
    }
    .quote-editor textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .quote-actions { margin-top: 8px; flex-wrap: wrap; }
    .quote-actions .action { min-height: 36px; }
    .quote-actions .action:disabled { opacity: .52; }
    .quote-bubble {
      position: absolute;
      z-index: 1;
      right: calc(50% + 44px);
      bottom: calc(100% - 30px);
      width: max-content;
      max-width: calc(50% - 32px);
      padding: 7px 9px;
      border-radius: 12px;
      background: #fff4df;
      color: #513342;
      box-shadow: 0 4px 13px #1e101060;
      font-size: 13px;
      line-height: 1.35;
      text-align: left;
      overflow-wrap: anywhere;
      pointer-events: none;
      animation: quote-fade .28s ease 2.2s both;
    }
    .quote-bubble[data-long] { font-size: 11px; }
    .quote-bubble::after {
      position: absolute;
      bottom: -6px;
      right: 10px;
      width: 10px;
      height: 8px;
      background: inherit;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      content: "";
    }
    @keyframes quote-fade { to { opacity: 0; } }
    .top-actions, .voice-actions { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .voice-actions { margin-top: 9px; }
    .voice-actions .action { min-height: 36px; padding: 5px 9px; }
    .voice-actions .action:disabled { opacity: .52; }
    .float.note { left: 23%; color: var(--note, #ffe3ad); }
    .chooser {
      display: grid;
      min-height: 100vh;
      align-content: center;
      gap: 12px;
      text-align: center;
    }
    .chooser p { margin: 0 0 9px; }
    .version {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border: 1px solid #efc27c70;
      border-radius: 17px;
      color: #ffe3ad;
      background: linear-gradient(115deg, #563525, #342116);
      font-size: 19px;
      font-weight: 700;
      text-align: left;
    }
    .version svg { width: 27px; height: 27px; }
    .version[data-version="oshi"] {
      border-color: #ecafe781;
      color: #ffe0fa;
      background: linear-gradient(115deg, #593660, #382443);
    }
    .cat-ears { display: none; }
    [data-skin="oshi"] {
      --accent: #edbdf1;
      --ink: #3e224b;
      --gold: #f9dafa;
      --soft: #e3c3eb;
      --line: #e9b5f044;
      --note: #f4cbff;
      --bg-high: #623d75;
      --bg-mid: #3c2751;
      --bg-low: #271b38;
      --ring: var(--accent);
      --ring-soft: var(--line);
      --ring-faint: var(--line);
      --button-top: #ffe0f5;
      --button-bottom: #ddb3f0;
      --button-border: #ffdcf2;
      --progress-track: #60436e;
      --progress-start: #c783cd;
      --progress-end: #fbd4f3;
      background: radial-gradient(ellipse at 51% 23%, #623d75, #3c2751 54%, #271b38 100%) fixed;
    }
    [data-skin="oshi"] h1, [data-skin="oshi"] .count { color: #ffe4fc; }
    [data-skin="oshi"] .sound, [data-skin="oshi"] .action { background: #3c284c; }
    [data-skin="oshi"] .primary { border-color: var(--button-border); background: linear-gradient(var(--button-top), var(--button-bottom)); }
    [data-skin="oshi"] .card { background: #291a3a9e; }
    [data-skin="oshi"] .title, [data-skin="oshi"] .draw, [data-skin="oshi"] .fortune h2 svg {
      border-color: var(--line);
      color: var(--gold);
      background: #c389d633;
    }
    [data-skin="oshi"] .wish { color: var(--gold); }
    [data-skin="oshi"] .pet {
      border-color: var(--ring);
      background: #95629e;
      box-shadow: 0 12px 30px #1d0f2c75, 0 0 23px #edb8ff42;
    }
    [data-skin="oshi"] .sparkles { fill: #ecbdff; }
    [data-skin="oshi"] .mark svg { color: #ecaee7; }
    [data-skin="oshi"] .mark::after { background: #ecaee770; }
    [data-skin="oshi"] .face-fill { fill: url(#face-lavender); }
    [data-skin="oshi"] .face-cheek { fill: #e896c9; }
    [data-skin="oshi"] .face-line { stroke: #784769; }
    [data-skin="oshi"] .face-heart { fill: #bc68a2; }
    [data-skin="oshi"] .cat-ears { display: initial; }
    [data-skin="oshi"] progress { color: #eabbf2; }
    [data-skin][data-palette] {
      --ink: var(--accent-ink);
      --gold: #fff1ec;
      --soft: #e3cfd9;
      --line: #ffe6f13d;
      --bg-high: var(--accent);
      --bg-mid: #2b202a;
      --bg-low: #1c151e;
      --ring: var(--accent);
      --ring-soft: var(--line);
      --ring-faint: var(--line);
      --button-top: var(--accent);
      --button-bottom: var(--accent);
      --button-border: var(--button-top);
      --progress-track: #564253;
      --progress-start: var(--accent);
      --progress-end: #fff1ec;
      background-image: linear-gradient(#130e17a8, #130e1700), radial-gradient(ellipse at 50% 22%, var(--bg-high), var(--bg-mid) 48%, var(--bg-low) 100%);
    }
    [data-skin][data-palette] h1, [data-skin][data-palette] .count, [data-skin][data-palette] .wish,
    [data-skin][data-palette] .mark svg, [data-skin][data-palette] .fortune h2 svg { color: var(--gold); }
    [data-skin][data-palette] .mark::after { background: var(--line); }
    [data-skin][data-palette] .sound, [data-skin][data-palette] .action:not(.primary),
    [data-skin][data-palette] .title, [data-skin][data-palette] .fortune h2 svg { background: var(--bg-mid); border-color: var(--line); }
    [data-skin][data-palette] .card, [data-skin][data-palette] .pet:not(.cutout) { background: var(--bg-low); }
    [data-skin][data-palette] .pet:not(.cutout) { box-shadow: 0 12px 30px #180c0875, 0 0 21px var(--ring-soft); }
    [data-skin][data-palette] .sparkles { fill: var(--ring); }
    @supports (color: color-mix(in srgb, black, white)) {
      [data-skin][data-palette] {
        --ink: #251820;
        --gold: color-mix(in srgb, var(--accent) 29%, white);
        --soft: color-mix(in srgb, var(--accent) 21%, #f2e8f0);
        --line: color-mix(in srgb, var(--gold) 23%, transparent);
        --bg-high: color-mix(in srgb, var(--accent) 36%, #221522);
        --bg-mid: color-mix(in srgb, var(--accent) 13%, #1c1320);
        --bg-low: color-mix(in srgb, var(--accent) 6%, #130e17);
        --ring: color-mix(in srgb, var(--accent) 70%, #f9e8f1);
        --ring-soft: color-mix(in srgb, var(--ring) 26%, transparent);
        --ring-faint: color-mix(in srgb, var(--ring) 14%, transparent);
        --button-top: color-mix(in srgb, var(--accent) 40%, #fff6fc);
        --button-bottom: color-mix(in srgb, var(--accent) 53%, #f5eaf1);
        --progress-track: color-mix(in srgb, var(--accent) 21%, #3d2e3a);
        --progress-start: var(--ring);
        --progress-end: var(--button-top);
        background-image: radial-gradient(ellipse at 50% 22%, var(--bg-high), var(--bg-mid) 48%, var(--bg-low) 100%);
      }
    }
    .pet.cutout { padding: 0; border: 0; background: transparent; box-shadow: none; }
    .pet.cutout .photo-frame { border-radius: 0; }
    .pet.cutout .photo { border-radius: 0; object-fit: contain; object-position: center bottom; transform-origin: center bottom; }
    .stage[data-cutout] .hand {
      top: calc(-26px + var(--head-offset, 0px) + var(--head-placement-y, 0px));
      left: calc(50% + var(--head-shift, 0px) + var(--head-placement-x, 0px));
    }
    .stage[data-cutout] .quote-bubble { bottom: calc(100% - 17px); }
    .combo {
      position: absolute;
      z-index: 4;
      top: 55%;

      padding: 4px 9px;
      border: 1px solid var(--ring);
      border-radius: 99px;
      background: var(--bg-low);

      font-weight: 700;

    }
    @keyframes combo-fade { to { opacity: 0; } }
    .float.big-heart { font-size: 55px; color: #ff98b2; }
    .extra-row, .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .extra-row { margin-top: 9px; }
    .extra-row .action, .tool-row .action { min-height: 36px; padding: 5px 9px; }
    .extra-panel { margin-top: 9px; padding: 12px; }
    .extra-panel h2 { margin-bottom: 7px; font-size: 15px; }
    .extra-panel .action:disabled { opacity: .5; }
    .countdown {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: 45px minmax(0, 1fr);
      align-items: start;
      gap: 12px;

    }

    .countdown-content { display: grid; gap: 4px; overflow-wrap: anywhere; }
    .countdown-name { font-size: 15px; font-weight: 700; }

    }

    .palette-options { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 9px; }

  <script>
    const byId = (id) => document.getElementById(id);
    const pet = byId('pet');
    const stage = byId('stage');
    const audio = byId('pat-audio');
    const defaultAudio = audio.getAttribute('src');
    const sound = byId('sound');
    const wish = byId('wish');
    const photo = byId('photo');
    const photoInput = byId('photo-input');
    const audioInput = byId('audio-input');
    const chooser = byId('chooser');
    const game = byId('game');
    const voiceInput = byId('voice-input');
    const voiceAudio = byId('voice-audio');
    const effectPool = [audio, byId('pat-audio-2'), byId('pat-audio-3')];
    const pinchAudio = byId('pinch-audio');
    const pinchDefault = pinchAudio.getAttribute('src');
    const pinchPool = [pinchAudio, byId('pinch-audio-2'), byId('pinch-audio-3')];
    let pinchIndex = 0;
    const voicePool = [voiceAudio, byId('voice-audio-2')];
    let effectIndex = 0;
    let voiceIndex = 0;
    const modeKey = 'xingan-pat-mode';
    const maxVoices = 3;
    const milestones = [0, 100, 300, 800, 2000, 5000, 12000, 30000];
    const versions = {
      star: {
        key: 'xingan-pat-star-v2',
        intro: '轻点本命的脸，摸摸头',
        defaultQuotes: ['今天也辛苦啦。', '要好好吃饭，知道吗。', '谢谢你来看我。'],
        comboQuotes: ['后排的灯牌也看到了，给你比个心！', '这次安可偷偷留给你。', '你的应援，我一直记着呢。'],
        wishTitles: ['闪闪发光', '直播惊喜', '饭撒预告', '等你翻牌', '今日存图', '奔赴见面', '告白好运', '演唱会好运', '更近一步', '直拍快乐', '应援有回应', '今日欧气'],
        titles: ['新入坑', '颜粉', '妈妈粉', '女友粉', '一体机', '梦女', '绯闻女友', '老婆'],
        wishes: [
          '你担今天也在为你闪闪发光。',
          '今日宜蹲直播，会有意想不到的营业。',
          '本命今日份的饭撒，马上就轮到你。',
          '抽到这张签的人，本周会被翻牌。',
          '今日宜存图，甜度超标预警。',
          '今天的等待，都会变成明天的见面。',
          '宜表白：你的喜欢，他都收得到。',
          '今日宜许愿，演唱会的票会向你走来。',
          '摸摸头的人，离见到本命又近了一天。',
          '宜刷直拍，快乐会翻倍。',
          '你的应援，他在台上看得见。',
          '今天欧气满满，适合抢票抽奖。'
        ]
      },
      oshi: {
        key: 'xingan-pat-oshi-v2',
        intro: '轻点你推的脸，摸摸头',
        defaultQuotes: ['别哭，我在。', '今天也来啦。', '嗯……就摸一下。'],
        comboQuotes: ['隐藏好感度解锁，奖励你一个贴贴。', '喂，屏幕那边的你，手速也太快了！', '连击判定全是 Perfect？那我也要反击了！'],
        wishTitles: ['抽卡好运', '次元来信', '买谷快乐', '产粮灵感', '次元许愿', '新物料在路上', '官宣有喜', '单推好运', '给娃添新衣', '隔屏告白', '快乐充能', '刚好喜欢你'],
        titles: ['新入坑', '有点上头', '单推人', '本命推', '亲妈本妈', '死忠守护', '纸片人本命', '次元壁粉碎者'],
        wishes: [
          '今日宜抽卡，欧气守恒，下一发必金。',
          '你推在次元那边，也在想你。',
          '今日宜买谷，快乐无价。',
          '宜产粮：太太，今天适合画图写文。',
          '次元壁今天格外薄，宜许愿。',
          '你推的新物料正在赶来的路上。',
          '宜蹲官宣，会有惊喜掉落。',
          '单推人的运气，不会太差。',
          '今天适合给自家娃添件新衣服。',
          '宜表白：隔着屏幕，他也收得到。',
          '摸一摸，快乐充能完毕。',
          '你喜欢的样子，他刚好都有。'
        ]
      }
    };
    const unsavedStats = new Map();
    let mode = '';
    let version;
    let state;
    let media;
    let viewRevision = 0;

    function readSaved(key) {
      try { return JSON.parse(localStorage.getItem(key)); }
      catch (_) { return null; }
    }

    function writeSaved(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (_) { return false; }
    }

    function titleIndex(count) {
      let index = milestones.length - 1;
      while (count < milestones[index]) index--;
      return index;
    }

    function refresh() {
      let saved = unsavedStats.get(mode) || readSaved(version.key);
      if (!saved && mode === 'star') {
        const old = readSaved('xingan-pat-v1');
        if (old) saved = { count: old.count, muted: old.muted };
      }
      const count = saved && Number.isSafeInteger(saved.count) && saved.count >= 0 ? saved.count : 0;
      state = { count, title: version.titles[titleIndex(count)], muted: !!(saved && saved.muted), daily: saved && saved.daily, ...readProgress(saved) };
    }

    function save() {
      if (writeSaved(version.key, state)) {
        unsavedStats.delete(mode);
        return true;
      } else {
        unsavedStats.set(mode, state);
        showStatus('浏览器存储不可用或已满，本次进度暂时只能保留在页面里。');
        return false;
      }
    }

    function renderStats() {
      const index = titleIndex(state.count);
      const next = milestones[index + 1];
      const progress = byId('progress');
      byId('count').textContent = state.count.toLocaleString('zh-CN');
      byId('today-count').textContent = `今日 ${todayCount().toLocaleString('zh-CN')} 次`;
      byId('title').textContent = state.title;
      progress.max = next ? next - milestones[index] : 1;
      progress.value = next ? state.count - milestones[index] : 1;
      byId('next-title').textContent = next ? `再摸 ${next - state.count} 次升为「${version.titles[index + 1]}」` : '已达最高称号';
    }

    function renderSound() {
      sound.toggleAttribute('data-off', state.muted);
      sound.setAttribute('aria-pressed', String(!state.muted));
      byId('sound-label').textContent = state.muted ? '声音关' : '声音开';
    }

    function today(now = new Date()) {
      return [now.getFullYear(), now.getMonth() + 1, now.getDate()].join('-');
    }

    function drawnToday(day) {
      const daily = state.daily;
      return !!daily && daily.day === day && Number.isInteger(daily.index) && !!version.wishes[daily.index];
    }

    function dailyFortune(day) {
      if (!drawnToday(day)) {
        const size = version.wishes.length;
        const offset = mode === 'oshi' ? 7 : 0;
        let index = ((calendarDay(day) * 5 + offset) % size + size) % size;
        if (state.daily && state.daily.index === index) index = (index + 1) % size;
        state.daily = { day, index };
        save();
      }
      return state.daily.index;
    }

    function renderFortune() {
      const index = dailyFortune(today());
      byId('wish-title').textContent = version.wishTitles[index];
      wish.textContent = version.wishes[index];
    }

    let midnightTimer;
    function updateDay() {
      clearTimeout(midnightTimer);
      if (!version) return;
      renderFortune();
      renderStats();
      renderCountdown();
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 100);
      midnightTimer = setTimeout(updateDay, Math.max(100, midnight - Date.now()));
    }

    function showStatus(message) {
      for (const id of ['status', 'controls-status']) {
        const status = byId(id);
        status.textContent = message;
        status.hidden = !message;
      }
    }

    function playPatSound(onRejected = () => {}) {
      if (state.muted) return;
      if (stage.dataset.interaction === 'pinch') {
        const pinchPlayer = pinchPool[pinchIndex];
        pinchIndex = (pinchIndex + 1) % pinchPool.length;
        const pinchPlaying = playFromStart(pinchPlayer);
        if (pinchPlaying) pinchPlaying.catch(onRejected);
        return;
      }
      const player = effectPool[effectIndex];
      effectIndex = (effectIndex + 1) % effectPool.length;
      const playing = playFromStart(player);
      if (playing) playing.catch(onRejected);
    }

    function playFromStart(player) {
      try { player.currentTime = 0; } catch (_) { /* A newly loaded source starts at zero. */ }
      return player.play();
    }

    function pausePlayers(players) {
      players.forEach((player) => player.pause());
    }

    let lastVoiceAt = -Infinity;
    function playTapAudio() {
      if (!version) return;
      playPatSound();
      playVoice();
    }

    function playVoice() {
      const now = performance.now();
      if (state.muted || !media.voices.length || now - lastVoiceAt < 8000 ||
          voicePool.some((player) => !player.paused && !player.ended) || Math.random() >= .1) return;
      lastVoiceAt = now;
      const clip = media.voices[Math.floor(Math.random() * media.voices.length)];
      const player = voicePool[voiceIndex];
      voiceIndex = (voiceIndex + 1) % voicePool.length;
      if (player.getAttribute('src') !== clip) player.src = clip;
      const revision = viewRevision;
      const playing = playFromStart(player);
      if (playing) playing.then(() => {
        if (revision === viewRevision && !state.muted && media.voices.includes(clip)) {
          floatFeedback('♪', 'float note');
        }
      }).catch(() => {});
      else floatFeedback('♪', 'float note');
    }

    function pat(playAudio = playTapAudio) {
      if (!version) return;
      refresh();
      playAudio();
      state.count = Math.min(Number.MAX_SAFE_INTEGER, state.count + 1);
      state.title = version.titles[titleIndex(state.count)];
      recordProgress();
      save();
      renderStats();
      renderSound();
      stage.classList.remove('patting');
      void stage.offsetWidth;
      stage.classList.add('patting');
      floatFeedback('♥');
      floatFeedback('♥', 'float soft-heart');
      maybeShowQuote();
      maybeShowReaction();
    }

    function floatFeedback(symbol, cssClass = 'float') {
      const heart = document.createElement('span');
      heart.className = cssClass;
      heart.setAttribute('aria-hidden', 'true');
      heart.textContent = symbol;
      stage.appendChild(heart);
      setTimeout(() => heart.remove(), 750);
    }

    const reactionStickers = ['😊', '🥰', '😳', '🤤', '😴', '✨'];
    function randomEntry(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function showReaction(element, parent, duration) {
      element.setAttribute('aria-hidden', 'true');
      parent.appendChild(element);
      setTimeout(() => element.remove(), duration);
    }

    function maybeShowReaction() {
      if (Math.random() >= .25) return;
      stage.querySelectorAll('.reaction').forEach((item) => item.remove());
      const sticker = document.createElement('span');
      sticker.className = 'reaction';
      sticker.textContent = randomEntry(reactionStickers);
      showReaction(sticker, stage, 1130);
    }

    function showComboLine() {
      stage.querySelectorAll('.combo-line').forEach((item) => item.remove());
      const bubble = document.createElement('span');
      bubble.className = 'combo-line';
      const mark = document.createElement('strong');
      mark.textContent = '！';
      const line = document.createElement('span');
      line.textContent = randomEntry(version.comboQuotes);
      bubble.appendChild(mark);
      bubble.appendChild(line);
      showReaction(bubble, stage, 2020);
    }

    function showReactionRain() {
      game.querySelectorAll('.reaction-rain').forEach((item) => item.remove());
      const rain = document.createElement('div');
      rain.className = 'reaction-rain';
      for (let index = 0; index < 32; index++) {
        const piece = document.createElement('span');
        piece.textContent = index % 2 ? '✦' : '♥';
        piece.style.setProperty('--x', `${(index + Math.random()) * 3.05}%`);
        piece.style.setProperty('--delay', `${Math.random() * .6}s`);
        piece.style.setProperty('--size', `${14 + Math.random() * 16}px`);
        piece.style.setProperty('--drift', `${(Math.random() - .5) * 56}px`);
        rain.appendChild(piece);
      }
      showReaction(rain, game, 2300);
    }

    function startPointerEffect() {
      const attempt = { revision: viewRevision, rejected: false };
      playPatSound(() => { attempt.rejected = true; });
      return attempt;
    }

    function finishPointerAudio(attempt) {
      if (!version || !attempt || attempt.revision !== viewRevision) return;
      if (attempt.rejected) playPatSound();
      playVoice();
    }

    // Play the effect on press. Retry on release only when that press was rejected.
    let pointerHandledTouch = false;
    let touchStarted = false;
    let touchEffect;
    let penEffect;
    let lastPhysicalEvent = -Infinity;
    pet.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.isPrimary === false) return;
      if (event.pointerType === 'touch') pointerHandledTouch = true;
      lastPhysicalEvent = performance.now();
      if (event.pointerType === 'touch') pat(() => { touchEffect = startPointerEffect(); });
      else if (event.pointerType === 'pen') pat(() => { penEffect = startPointerEffect(); });
      else pat();
    });
    pet.addEventListener('pointerup', (event) => {
      if (event.button !== 0 || event.isPrimary === false) return;
      lastPhysicalEvent = performance.now();
      if (event.pointerType === 'pen') {
        const attempt = penEffect;
        penEffect = null;
        finishPointerAudio(attempt);
      }
      if (event.pointerType === 'touch' && !touchStarted) {
        pointerHandledTouch = false;
        const attempt = touchEffect;
        touchEffect = null;
        finishPointerAudio(attempt);
      }
    });
    pet.addEventListener('pointercancel', (event) => {
      if (event.pointerType === 'touch' && !touchStarted) pointerHandledTouch = false;
      if (event.pointerType === 'touch') touchEffect = null;
      if (event.pointerType === 'pen') penEffect = null;
    });
    pet.addEventListener('touchstart', () => { touchStarted = true; }, { passive: true });
    pet.addEventListener('touchend', (event) => {
      if (event.cancelable) event.preventDefault();

    function readMedia() {

    async function compressPhoto(file) {

        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

        const encoded = canvas.toDataURL('image/jpeg', .82);
        if (!encoded.startsWith('data:image/')) throw new Error();
        return encoded;
      } catch (_) {
        throw new Error('这张图处理不了，试试 JPG、PNG 或 WebP。');

      }

    const mediaRequests = {};

    const maxQuotes = 50;

    function collectQuotes(text) {

      for (const raw of text.split(/\r\n?|\n/)) {

        resetEditor();
        byId('editor-done').disabled = false;
        autoCutoutButton.disabled = false;
      } catch (_) {
        if (request === photoRequest) photoStatus('这张照片无法在画布上打开。');
      }
    }

    function editorTransform() {
      const { width, height } = editor.bitmap;
      const scale = Math.min(editorView.width / width, editorView.height / height) * Number(zoomControl.value);
      const overX = Math.max(editorView.width * .18, (width * scale - editorView.width) / 2);
      const overY = Math.max(editorView.height * .18, (height * scale - editorView.height) / 2);
      editor.x = Math.min(overX, Math.max(-overX, editor.x));
      editor.y = Math.min(overY, Math.max(-overY, editor.y));
      return {
        scale,
        x: (editorView.width - width * scale) / 2 + editor.x,
        y: (editorView.height - height * scale) / 2 + editor.y
      };
    }

    function drawEditor() {
      if (!editor) return;
      const view = editorView.getContext('2d');
      const { scale, x, y } = editorTransform();
      view.clearRect(0, 0, editorView.width, editorView.height);
      view.drawImage(editor.bitmap, x, y, editor.bitmap.width * scale, editor.bitmap.height * scale);
      byId('editor-undo').disabled = !editor.undo.length;
      restoreBrush.hidden = !editor.autoApplied;
      restoreBrush.setAttribute('aria-pressed', String(editor.restoring));
    }

    function resetEditor() {
      if (!editor) return;
      const { bitmap, context, image } = editor;
      context.clearRect(0, 0, bitmap.width, bitmap.height);
      context.drawImage(image, 0, 0);
      editor.undo.length = 0;
      editor.autoApplied = false;
      editor.restoring = false;
      if (!editor.autoBusy) setAutoCutoutStatus('');
      drawEditor();
    }

    function editorPosition(event) {
      const rect = editorView.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * editorView.width / rect.width,
        y: (event.clientY - rect.top) * editorView.height / rect.height
      };
    }

    function eraseAt(point, previous) {
      const { context } = editor;
      const transform = editorTransform();
      const toImage = (position) => [(position.x - transform.x) / transform.scale, (position.y - transform.y) / transform.scale];
      const [x, y] = toImage(point);
      const size = Number(byId('brush-size').value);
      context.save();
      if (editor.restoring) {
        restoreStroke(x, y, size / 2, previous && toImage(previous));
        context.restore();
        drawEditor();
        return;
      }
      context.globalCompositeOperation = 'destination-out';
      context.beginPath();
      if (previous) {
        context.lineWidth = size;
        context.lineCap = 'round';
        context.moveTo(...toImage(previous));
        context.lineTo(x, y);
        context.stroke();
      } else {
        context.arc(x, y, size / 2, 0, 2 * Math.PI);
        context.fill();
      }
      context.restore();
      drawEditor();
    }

    function restoreStroke(x, y, radius, previous) {
      const { context, image, bitmap } = editor;
      context.beginPath();
      if (previous && (x !== previous[0] || y !== previous[1])) {
        const [px, py] = previous;
        const angle = Math.atan2(y - py, x - px);
        const ox = radius * Math.sin(angle);
        const oy = -radius * Math.cos(angle);
        context.moveTo(px + ox, py + oy);
        context.lineTo(x + ox, y + oy);
        context.arc(x, y, radius, angle - Math.PI / 2, angle + Math.PI / 2);
        context.lineTo(px - ox, py - oy);
        context.arc(px, py, radius, angle + Math.PI / 2, angle + 3 * Math.PI / 2);
        context.closePath();
      } else {
        context.arc(x, y, radius, 0, 2 * Math.PI);
      }
      context.clip();
      context.clearRect(0, 0, bitmap.width, bitmap.height);
      context.drawImage(image, 0, 0);
    }

    function rememberEdit() {
      const { bitmap, context, undo, autoApplied } = editor;
      undo.push({ pixels: context.getImageData(0, 0, bitmap.width, bitmap.height), autoApplied });
      if (undo.length > 20) undo.shift();
    }

    function setEditorTool(tool, restoring = false) {
      if (editor) {
        editor.tool = tool;
        editor.restoring = restoring;
        editor.gesture = null;
        editor.touchPoints.clear();
        editor.pinch = null;
      }
      byId('editor-pan').setAttribute('aria-pressed', String(tool === 'pan'));
      byId('editor-scale').setAttribute('aria-pressed', String(tool === 'zoom'));
      byId('editor-erase').setAttribute('aria-pressed', String(tool === 'brush' && !restoring));
      restoreBrush.setAttribute('aria-pressed', String(restoring));
      byId('editor-zoom-control').hidden = tool !== 'zoom';
    }

    function pinchDistance() {
      const [first, second] = editor.touchPoints.values();
      return Math.hypot(first.x - second.x, first.y - second.y);
    }

    function setEditorZoom(value) {
      zoomControl.value = String(Math.min(4, Math.max(1, value)));
      drawEditor();
    }

    function beginEdit(event, id) {
      if (!editor) return false;
      const point = editorPosition(event);
      if (editor.tool === 'zoom') {
        if (!editor.touchPoints.has(id) && editor.touchPoints.size < 2) editor.touchPoints.set(id, point);
        if (editor.touchPoints.size === 2 && !editor.pinch) {
          const distance = pinchDistance();
          if (distance > 0) editor.pinch = { distance, zoom: Number(zoomControl.value) };
        }
        return editor.touchPoints.has(id);
      }
      if (editor.gesture) return false;
      const pan = editor.tool === 'pan';
      if (editor.autoBusy && !pan) return false;
      editor.gesture = { id, point, pan };
      if (!pan) {
        rememberEdit();
        eraseAt(point);
      }
      return true;
    }

    function moveEdit(event, id) {
      if (!editor) return;
      if (editor.tool === 'zoom') {
        if (!editor.touchPoints.has(id)) return;
        editor.touchPoints.set(id, editorPosition(event));
        if (editor.pinch) setEditorZoom(editor.pinch.zoom * pinchDistance() / editor.pinch.distance);
        return;
      }
      if (!editor.gesture || editor.gesture.id !== id) return;
      const point = editorPosition(event);
      const previous = editor.gesture.point;
      if (editor.gesture.pan) {
        editor.x += point.x - previous.x;
        editor.y += point.y - previous.y;
        drawEditor();
      } else {
        eraseAt(point, previous);
      }
      editor.gesture.point = point;
    }

    function endEdit(id) {
      if (!editor) return;
      if (editor.touchPoints.delete(id)) editor.pinch = null;
      if (editor.gesture && editor.gesture.id === id) editor.gesture = null;
    }

    editorView.addEventListener('pointerdown', (event) => {
      if (event.button === 0 && beginEdit(event, event.pointerId)) editorView.setPointerCapture(event.pointerId);
    });
    editorView.addEventListener('pointermove', (event) => moveEdit(event, event.pointerId));
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
      editorView.addEventListener(type, (event) => endEdit(event.pointerId));
    });
    if (!window.PointerEvent) {
      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((type) => {
        editorView.addEventListener(type, (event) => {
          if (event.cancelable) event.preventDefault();
          Array.from(event.changedTouches).forEach((touch) => {
            if (type === 'touchstart') beginEdit(touch, touch.identifier);
            else if (type === 'touchmove') moveEdit(touch, touch.identifier);
            else endEdit(touch.identifier);
          });
        }, { passive: false });
      });
    }
    zoomControl.addEventListener('input', () => {
      if (editor && editor.tool === 'zoom') drawEditor();
    });
    editorView.addEventListener('wheel', (event) => {
      if (!editor) return;
      if (editor.tool !== 'zoom') {
        if (event.ctrlKey && event.cancelable) event.preventDefault();
        return;
      }
      if (event.cancelable) event.preventDefault();
      setEditorZoom(Number(zoomControl.value) * Math.exp(-event.deltaY * .002));
    }, { passive: false });
    byId('editor-pan').addEventListener('click', () => setEditorTool('pan'));
    byId('editor-scale').addEventListener('click', () => setEditorTool('zoom'));
    byId('editor-erase').addEventListener('click', () => setEditorTool('brush'));
    restoreBrush.addEventListener('click', () => {
      if (!editor || !editor.autoApplied) return;
      setEditorTool('brush', !editor.restoring);
    });
    byId('editor-undo').addEventListener('click', () => {
      if (!editor || !editor.undo.length) return;
      const previous = editor.undo.pop();
      editor.context.putImageData(previous.pixels, 0, 0);
      editor.autoApplied = previous.autoApplied;
      if (!editor.autoApplied) {
        editor.restoring = false;
        if (!editor.autoBusy) setAutoCutoutStatus('');
      }
      drawEditor();
    });
    byId('editor-reset').addEventListener('click', resetEditor);

    const visionCdn = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
    const selfieModel = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
    let autoSegmenter;

    function setAutoCutoutStatus(message) {
      const status = byId('auto-cutout-status');
      status.textContent = message;
      status.hidden = !message;
    }

    async function createAutoSegmenter(signal) {
      const [vision, response] = await Promise.all([
        import(visionCdn + '/vision_bundle.mjs'),
        fetch(selfieModel, { signal, credentials: 'omit' })
      ]);
      if (!response.ok) throw new Error('Model download failed');
      const [files, buffer] = await Promise.all([
        vision.FilesetResolver.forVisionTasks(visionCdn + '/wasm'),
        response.arrayBuffer()
      ]);
      const create = (delegate) => vision.ImageSegmenter.createFromOptions(files, {
        baseOptions: { modelAssetBuffer: new Uint8Array(buffer), delegate },
        runningMode: 'IMAGE',
        outputCategoryMask: false,
        outputConfidenceMasks: true
      });
      try {
        return await create('GPU');
      } catch (error) {
        if (signal.aborted) throw error;
        return create('CPU');
      }
    }

    function loadAutoSegmenter() {
      if (autoSegmenter) return autoSegmenter;
      const controller = new AbortController();
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => {
          controller.abort();
          reject(new Error('Automatic cutout download timed out'));
        }, 18000);
      });
      const load = createAutoSegmenter(controller.signal).then((segmenter) => {
        if (controller.signal.aborted) {
          segmenter.close();
          throw new Error('Automatic cutout download timed out');
        }
        return segmenter;
      });
      autoSegmenter = Promise.race([load, timeout]).then(
        (segmenter) => {
          clearTimeout(timer);
          return segmenter;
        },
        (error) => {
          clearTimeout(timer);
          autoSegmenter = null;
          throw error;
        }
      );
      return autoSegmenter;
    }

    function samplePersonMask(segmenter, active) {
      const { bitmap, context, image } = active;
      const { width, height } = bitmap;
      const input = document.createElement('canvas');
      const scale = Math.min(1, 1024 / Math.max(image.naturalWidth, image.naturalHeight));
      input.width = Math.max(1, Math.round(image.naturalWidth * scale));
      input.height = Math.max(1, Math.round(image.naturalHeight * scale));
      input.getContext('2d').drawImage(image, 0, 0, input.width, input.height);
      let resultPixels = null;
      segmenter.segment(input, (result) => {
        const masks = result.confidenceMasks || [];
        // Binary selfie models may expose one foreground channel or separate background/person channels.
        const mask = masks.length === 1 ? masks[0] : masks[1];
        if (!mask || !mask.width || !mask.height) return;
        const confidence = mask.getAsFloat32Array();
        const pixels = context.getImageData(0, 0, width, height);
        const foreground = new Uint8Array(width * height);
        let visible = 0;
        for (let y = 0; y < height; y++) {
          const row = Math.floor(y * mask.height / height) * mask.width;
          for (let x = 0; x < width; x++) {
            const index = y * width + x;
            if (!(confidence[row + Math.floor(x * mask.width / width)] >= .53) || !pixels.data[index * 4 + 3]) continue;
            foreground[index] = 255;
            visible++;
          }
        }
        if (visible < Math.max(8, width * height * .002)) return;
        // Blur only the mask by one output pixel, preserving opaque interiors and existing erasing.
        const horizontal = new Uint8Array(foreground.length);
        for (let y = 0; y < height; y++) {
          const row = y * width;
          for (let x = 0; x < width; x++) {
            const index = row + x;
            horizontal[index] = (foreground[row + Math.max(0, x - 1)] +
              2 * foreground[index] + foreground[row + Math.min(width - 1, x + 1)]) / 4;
          }
        }
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const index = y * width + x;
            const alpha = (horizontal[Math.max(0, y - 1) * width + x] +
              2 * horizontal[index] + horizontal[Math.min(height - 1, y + 1) * width + x]) / 4;
            pixels.data[index * 4 + 3] = Math.min(pixels.data[index * 4 + 3], alpha);
          }
        }
        resultPixels = pixels;
      });
      return resultPixels;
    }

    autoCutoutButton.addEventListener('click', async () => {
      if (!editor || editor.autoBusy || (editor.gesture && !editor.gesture.pan)) return;
      const active = editor;
      active.autoBusy = true;
      autoCutoutButton.disabled = true;
      setAutoCutoutStatus(autoSegmenter ? '正在准备自动抠图…' : '正在准备自动抠图，首次需要下载几 MB…');
      try {
        const segmenter = await loadAutoSegmenter();
        if (editor !== active) return;
        setAutoCutoutStatus('正在识别人物…');
        await new Promise((resolve) => setTimeout(resolve, 0));
        if (editor !== active) return;
        const pixels = samplePersonMask(segmenter, active);
        if (!pixels) {
          setAutoCutoutStatus('这张图没识别出人物，可以继续手动擦。');
          return;
        }
        rememberEdit();
        active.context.putImageData(pixels, 0, 0);
        active.autoApplied = true;
        active.restoring = false;
        drawEditor();
        setAutoCutoutStatus('自动抠图完成。可以继续修边，满意后点「完成」。');
      } catch (_) {
        if (editor === active) setAutoCutoutStatus('自动抠图暂时用不了。可以重试，也可以继续手动擦。');
      } finally {
        if (editor === active) {
          active.autoBusy = false;
          autoCutoutButton.disabled = false;
        }
      }
    });

    function finishCutout() {
      if (!editor) return;
      const { width, height } = editor.bitmap;
      const { data } = editor.context.getImageData(0, 0, width, height);
      let left = width;
      let top = height;
      let right = -1;
      let bottom = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (!data[(y * width + x) * 4 + 3]) continue;
          left = Math.min(left, x);
          top = Math.min(top, y);
          right = Math.max(right, x);
          bottom = Math.max(bottom, y);
        }
      }
      if (right < left) {
        photoStatus('照片已全部擦除，请先撤销或重来。');
        return;
      }
      const cropped = document.createElement('canvas');
      cropped.width = right - left + 1;
      cropped.height = bottom - top + 1;
      cropped.getContext('2d').drawImage(editor.bitmap, left, top, cropped.width, cropped.height, 0, 0, cropped.width, cropped.height);
      const src = editor.autoApplied ? cropped.toDataURL('image/png') : cropped.toDataURL('image/webp', .87);
      if (!src.startsWith('data:image/')) throw new Error();
      let crown = 0;
      let opacity = 0;
      const crownBottom = Math.min(bottom, top + Math.max(2, Math.floor(cropped.height * .05)));
      for (let y = top; y <= crownBottom; y++) {
        for (let x = left; x <= right; x++) {
          const alpha = data[(y * width + x) * 4 + 3];
          crown += (x - left + .5) * alpha;
          opacity += alpha;
        }
      }
      const headShift = (crown / opacity - cropped.width / 2) / Math.max(cropped.width, cropped.height);
      commitPhoto(src, photoDraft, Math.min(1, cropped.height / cropped.width), headShift);
    }

    byId('editor-done').addEventListener('click', () => {
      try { finishCutout(); }
      catch (_) { photoStatus('无法导出抠图，请重试。'); }
    });

    const palettes = {
      red: ['红', '#ec656c'],
      pink: ['粉', '#f495ba'],
      blue: ['蓝', '#83acf3'],
      purple: ['紫', '#b58bf2'],
      green: ['绿', '#78d4ad'],
      orange: ['橙', '#ffae67'],
      gold: ['金', '#efc27c'],
      silver: ['银白', '#e3e6ed']
    };
    const defaultAccents = { star: palettes.gold[1], oshi: '#edbdf1' };
    const achievements = [
      ['first', '初次心动', '累计摸头 1 次', (s) => s.count >= 1],
      ['hundred', '小试身手', '累计摸头 100 次', (s) => s.count >= 100],
      ['fiveHundred', '渐入佳境', '累计摸头 500 次', (s) => s.count >= 500],
      ['thousand', '千次之约', '累计摸头 1,000 次', (s) => s.count >= 1000],
      ['tenThousand', '万次奔赴', '累计摸头 10,000 次', (s) => s.count >= 10000],
      ['combo', '连击达人', '单次连击达到 50', (s) => s.bestCombo >= 50],
      ['sevenDays', '七日之约', '在 7 个不同的日子摸过头', (s) => s.days.length >= 7],
      ['night', '夜猫子', '在 23:00–05:00 摸头一次', (_s, now) => now && (now.getHours() >= 23 || now.getHours() < 5)]
    ];
    const isDay = (date) => typeof date === 'string' && /^\d{4}-\d{1,2}-\d{1,2}$/.test(date);
    const safeCount = (count) => Number.isSafeInteger(count) && count >= 0 ? count : 0;
    const validPalette = (key) => Object.prototype.hasOwnProperty.call(palettes, key);
    const validAccent = (value) => typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);

    function readProgress(saved) {
      const old = saved || {};
      const daily = old.dailyPats || {};
      const awards = {};
      for (const [key] of achievements) {
        if (old.awards && isDay(old.awards[key])) awards[key] = old.awards[key];
      }
      const event = old.event;
      return {
        dailyPats: { day: isDay(daily.day) ? daily.day : '', count: safeCount(daily.count) },
        bestCombo: safeCount(old.bestCombo),
        days: Array.isArray(old.days) ? [...new Set(old.days.filter(isDay))] : [],
        awards,
        event: event && typeof event.name === 'string' && event.name.trim() && Number.isFinite(calendarDay(event.date))
          ? { name: event.name.trim().slice(0, 40), date: event.date } : null,
        palette: validPalette(old.palette) ? old.palette : 'gold',
        customAccent: validAccent(old.customAccent) ? old.customAccent.toLowerCase() : ''
      };
    }

    function todayCount() {
      return state.dailyPats.day === today() ? state.dailyPats.count : 0;
    }

    const comboTag = byId('combo');
    let comboCount = 0;
    let previousPat = -Infinity;
    let comboTimer;
    let comboHideTimer;

    function resetCombo() {
      clearTimeout(comboTimer);
      clearTimeout(comboHideTimer);
      comboCount = 0;
      previousPat = -Infinity;
      comboTag.hidden = true;
    }

    function recordProgress() {
      const clock = performance.now();
      const now = new Date();
      const day = today(now);
      if (state.dailyPats.day !== day) state.dailyPats = { day, count: 0 };
      state.dailyPats.count = Math.min(Number.MAX_SAFE_INTEGER, state.dailyPats.count + 1);
      if (!state.days.includes(day)) state.days.push(day);
      comboCount = clock - previousPat < 600 ? comboCount + 1 : 1;
      previousPat = clock;
      state.bestCombo = Math.max(state.bestCombo, comboCount);
      clearTimeout(comboTimer);
      clearTimeout(comboHideTimer);
      comboTag.hidden = true;
      if (comboCount >= 5) {
        comboTag.textContent = `x${comboCount} 连击`;
        void comboTag.offsetWidth;
        comboTag.hidden = false;
        comboHideTimer = setTimeout(() => { comboTag.hidden = true; }, 1450);
      }
      comboTimer = setTimeout(() => {
        comboCount = 0;
        previousPat = -Infinity;
      }, 1200);
      if (comboCount === 20) showComboLine();
      if (comboCount === 50) floatFeedback('♥', 'float big-heart');
      if (comboCount === 100) showReactionRain();
      unlockAchievements(now);
    }

    const badgeWall = byId('badges');
    const toast = byId('achievement-toast');
    let badgeSignature = '';
    const notices = [];
    let toastTimer;

    function nextNotice() {
      const title = notices.shift();
      toast.hidden = !title;
      toast.textContent = title ? `成就达成：${title}` : '';
      toastTimer = title ? setTimeout(nextNotice, 2000) : null;
    }

    function unlockAchievements(now, notify = true) {
      let changed = false;
      const day = today(now || new Date());
      for (const [id, title, , test] of achievements) {
        if (state.awards[id] || !test(state, now)) continue;
        state.awards[id] = day;
        changed = true;
        if (notify) notices.push(title);
      }
      if (notices.length && !toastTimer) nextNotice();
      if (changed) renderAchievements();
      return changed;
    }

    function renderAchievements() {
      const signature = JSON.stringify(state.awards);
      if (signature === badgeSignature) return;
      badgeSignature = signature;
      badgeWall.textContent = '';
      for (const [id, title, condition] of achievements) {
        const badge = document.createElement('div');
        badge.className = 'badge';
        const name = document.createElement('strong');
        name.textContent = title;
        const detail = document.createElement('span');
        detail.textContent = condition;
        badge.appendChild(name);
        badge.appendChild(detail);
        if (state.awards[id]) {
          badge.setAttribute('data-unlocked', '');
          const date = document.createElement('time');
          date.textContent = state.awards[id];
          badge.appendChild(date);
        }
        badgeWall.appendChild(badge);
      }
    }

    function calendarDay(text) {
      if (typeof text !== 'string' || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)) return NaN;
      const [year, month, day] = text.split('-').map(Number);
      const date = new Date(0);
      date.setUTCFullYear(year, month - 1, day);
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day
        ? date.getTime() / 86400000 : NaN;
    }

    function renderCountdown() {
      const banner = byId('countdown');
      banner.hidden = !state.event;
      if (!state.event) return;
      const { name, date } = state.event;
      const count = calendarDay(date) - calendarDay(today());
      const isToday = count === 0;
      const isSoon = count > 0 && count <= 7;
      banner.dataset.state = isToday ? 'today' : count < 0 ? 'past' : isSoon ? 'soon' : 'future';
      byId('countdown-name').textContent = `「${name}」`;
      const value = byId('countdown-value');
      value.textContent = isToday ? '就是今天！' : String(Math.abs(count));
      value.setAttribute('aria-hidden', String(!isToday));
      byId('countdown-detail').hidden = isToday;
      byId('countdown-status').textContent = isToday ? '' : `${count > 0 ? '还有' : '已过去'} ${Math.abs(count)} 天`;
      byId('countdown-soon').hidden = !isSoon;
      byId('countdown-hearts').hidden = !isToday;
    }

    function settingsStatus(message) {
      const status = byId('settings-status');
      status.textContent = message;
      status.hidden = !message;
    }

    function renderEventFields() {
      byId('event-name').value = state.event ? state.event.name : '';
      byId('event-date').value = state.event ? state.event.date : '';
      byId('event-clear').disabled = !state.event;
    }

    function changeEvent(event) {
      refresh();
      state.event = event;
      settingsStatus(save() ? (event ? '日子已保存。' : '日子已清除。') : '浏览器存储不可用，本次修改暂留在页面内。');
      renderEventFields();
      renderCountdown();
    }

    byId('event-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = byId('event-name').value.trim().slice(0, 40);
      const date = byId('event-date').value;
      if (!name || !Number.isFinite(calendarDay(date))) {
        settingsStatus('请填写名称和有效日期。');
        return;
      }
      changeEvent({ name, date });
    });
    byId('event-clear').addEventListener('click', () => changeEvent(null));

    const swatches = Object.entries(palettes).map(([id, [label, color]]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch';
      button.title = label;
      button.setAttribute('aria-label', label);
      button.style.setProperty('--swatch', color);
      button.addEventListener('click', () => {
        if (mode !== 'star') return;
        changeAccent('', id);
      });
      byId('swatches').appendChild(button);
      return [id, button];
    });

    const customColor = byId('custom-color');

    function changeAccent(customAccent, preset) {
      refresh();
      const palette = preset || state.palette;
      if (state.customAccent === customAccent && state.palette === palette) return;
      state.customAccent = customAccent;
      state.palette = palette;
      const saved = save();
      settingsStatus(saved ? '' : '浏览器存储不可用，本次配色暂留在页面内。');
      applyPalette();
    }

    function onCustomColor() {
      if (version && validAccent(customColor.value)) changeAccent(customColor.value.toLowerCase());
    }

    customColor.addEventListener('input', onCustomColor);
    customColor.addEventListener('change', onCustomColor);
    byId('reset-color').addEventListener('click', () => changeAccent('', 'gold'));

    function accentInk(color) {
      const weights = [.2126, .7152, .0722];
      const luminance = weights.reduce((sum, weight, index) => {
        const channel = parseInt(color.slice(1 + index * 2, 3 + index * 2), 16) / 255;
        const linear = channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4;
        return sum + linear * weight;
      }, 0);
      return luminance > .179 ? '#140e17' : '#fff8fa';
    }

    function applyPalette() {
      const stageTheme = document.body;
      const star = mode === 'star';
      const custom = !!state.customAccent;
      const accent = state.customAccent || (star && state.palette !== 'gold' ? palettes[state.palette][1] : defaultAccents[mode]);
      const changed = custom || (star && state.palette !== 'gold');
      delete stageTheme.dataset.palette;
      stageTheme.style.setProperty('--accent', accent);
      stageTheme.style.setProperty('--accent-ink', accentInk(accent));
      if (changed) stageTheme.dataset.palette = custom ? 'custom' : state.palette;
      document.querySelector('meta[name="theme-color"]').content = changed ? accent : star ? '#291913' : '#3c2751';
      byId('swatches').hidden = !star;
      byId('custom-swatch').toggleAttribute('data-selected', custom);
      byId('reset-color').disabled = !changed;
      if (customColor.value !== accent) customColor.value = accent;
      for (const [id, button] of swatches) button.setAttribute('aria-pressed', String(star && !custom && state.palette === id));
    }

    function togglePanel(name, open) {
      const panel = byId(name);
      panel.hidden = !open;
      byId(name + '-toggle').setAttribute('aria-expanded', String(open));
      if (name === 'settings') {
        byId('countdown').setAttribute('aria-expanded', String(open));
        byId('settings-backdrop').hidden = !open;
        game.querySelectorAll('[data-settings-background]').forEach((item) => item.toggleAttribute('inert', open));
        if (open) document.body.classList.add('settings-open');
        else document.body.classList.remove('settings-open');
      }
    }

    function setSettingsOpen(open) {
      if (open && byId('settings').hidden) {
        renderEventFields();
        settingsStatus('');
        byId('settings').scrollTop = 0;
      }
      togglePanel('settings', open);
    }

    let settingsOpener;
    function openSettings(opener, focusId) {
      settingsOpener = opener;
      setSettingsOpen(true);
      byId(focusId).focus();
    }

    function closeSettings() {
      setSettingsOpen(false);
      if (settingsOpener) settingsOpener.focus();
    }

    byId('settings-toggle').addEventListener('click', () => {
      if (byId('settings').hidden) openSettings(byId('settings-toggle'), 'settings-heading');
      else closeSettings();
    });
    byId('settings-close').addEventListener('click', closeSettings);
    byId('settings-backdrop').addEventListener('click', closeSettings);
    byId('settings').addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeSettings();
    });
    byId('countdown').addEventListener('click', () => {
      openSettings(byId('countdown'), 'settings-title');
    });
    byId('achievements-toggle').addEventListener('click', () => {
      renderAchievements();
      togglePanel('achievements', byId('achievements').hidden);
    });

    let posterRequest = 0;
    const posterPanel = byId('poster-panel');
    const makePoster = byId('make-poster');

    function closePoster() {
      posterRequest++;
      posterPanel.hidden = true;
      makePoster.disabled = false;
      byId('poster-image').removeAttribute('src');
      byId('poster-download').removeAttribute('href');
    }

    function posterLines(context, text, width) {
      const lines = [];
      let line = '';
      for (const character of text) {
        if (line && context.measureText(line + character).width > width) {
          lines.push(line);
          line = '';
        }
        line += character;
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawPoster(image, info) {
      const canvas = document.createElement('canvas');
      canvas.width = 750;
      canvas.height = 1000;
      const context = canvas.getContext('2d');
      if (!context) throw new Error();
      const gradient = context.createLinearGradient(50, 0, 710, 1000);
      info.colors.forEach((color, index) => gradient.addColorStop(index / 2, color));
      context.fillStyle = gradient;
      context.fillRect(0, 0, 750, 1000);
      context.strokeStyle = info.accent;
      context.lineWidth = 2;
      context.strokeRect(30, 30, 690, 940);
      context.fillStyle = info.accent;
      context.textAlign = 'center';
      const text = (value, y, size, weight = 400) => {
        context.font = `${weight} ${size}px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif`;
        context.fillText(value, 375, y, 630);
      };
      text('摸一摸你的心肝', 112, 50, 700);
      text(info.date, 160, 25);
      if (image) {
        const edge = 330;
        const x = 375 - edge / 2;
        const y = 198;
        const w = image.naturalWidth;
        const h = image.naturalHeight;
        const fit = info.cutout ? Math.min(edge / w, edge / h) : Math.max(edge / w, edge / h);
        const placement = info.photoPlacement;
        const width = w * fit * placement.scale;
        const height = h * fit * placement.scale;
        const top = info.cutout ? y + edge - height : y + (edge - height) / 2;
        context.save();
        context.beginPath();
        if (info.cutout) context.rect(x, y, edge, edge);
        else context.arc(375, y + edge / 2, edge / 2, 0, Math.PI * 2);
        context.clip();
        context.drawImage(
          image, x + (edge - width) / 2 + placement.x * edge,
          top + placement.y * edge, width, height
        );
        context.restore();
      }
      const offset = image ? 0 : -130;
      text(info.title, 603 + offset, 44, 700);
      text(`今日摸头 ${info.today} 次`, 675 + offset, 34);
      text(`累计摸头 ${info.total} 次`, 728 + offset, 28);
      text('今日一签', 802 + offset, 23, 700);
      context.font = '26px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
      posterLines(context, info.wish, 610).forEach((line, index) => text(line, 844 + index * 34 + offset, 26));
      text('摸一摸你的心肝', 936, 21);
      return canvas.toDataURL('image/png');
    }

    function posterTheme() {
      const probe = document.createElement('span');
      probe.hidden = true;
      document.body.appendChild(probe);
      const color = (name) => {
        probe.style.color = `var(${name})`;
        return getComputedStyle(probe).color;
      };
      const colors = ['--bg-high', '--bg-mid', '--bg-low'].map(color);
      const accent = color('--gold');
      probe.remove();
      return { colors, accent };
    }

    makePoster.addEventListener('click', async () => {
      const request = ++posterRequest;
      makePoster.disabled = true;
      showStatus('');
      refresh();
      const day = today();
      const info = {
        ...posterTheme(),
        date: day.split('-').map((part) => part.padStart(2, '0')).join('-'),
        title: state.title,
        today: todayCount().toLocaleString('zh-CN'),
        total: state.count.toLocaleString('zh-CN'),
        wish: version.wishes[dailyFortune(day)],
        cutout: media.cutRatio > 0,
        photoPlacement: media.photoPlacement
      };
      try {
        const image = media.photo ? await loadImage(media.photo) : null;
        if (request !== posterRequest) return;
        const url = drawPoster(image, info);
        if (!url.startsWith('data:image/png')) throw new Error();
        byId('poster-image').src = url;
        const download = byId('poster-download');
        download.href = url;
        download.download = `摸一摸你的心肝-${info.date}.png`;
        posterPanel.hidden = false;
        posterPanel.scrollIntoView({ block: 'nearest' });
      } catch (_) {
        if (request === posterRequest) showStatus('海报生成失败，请重试。');
      } finally {
        if (request === posterRequest) makePoster.disabled = false;
      }
    });
    byId('poster-close').addEventListener('click', closePoster);

    function render() {
      renderSound();
      updateDay();
      renderAchievements();
      applyPalette();
    }

    function applyInteraction(action) {
      const pinch = action === 'pinch';
      stage.classList.remove('patting');
      stage.dataset.interaction = pinch ? 'pinch' : 'pat';
      pet.setAttribute('aria-label', pinch ? '捏捏脸' : '摸摸头');
      byId('game-intro').textContent = pinch ? version.intro.replace('摸摸头', '捏捏脸') : version.intro;
      byId('action-pat').setAttribute('aria-pressed', String(!pinch));
      byId('action-pinch').setAttribute('aria-pressed', String(pinch));
    }

    for (const action of ['pat', 'pinch']) {
      byId('action-' + action).addEventListener('click', () => {
        if (!version) return;
        applyInteraction(action);
        if (!writeSaved(version.key + '-interaction', action)) {
          settingsStatus('本次互动方式已切换，浏览器未能保存。');
        }
      });
    }

    function enterMode(selected, focusTitle = false) {
      if (selected !== 'star' && selected !== 'oshi') return;
      viewRevision++;
      mode = selected;
      version = versions[selected];
      document.body.dataset.skin = selected;
      applyInteraction(readSaved(version.key + '-interaction'));
      chooser.hidden = true;
      game.hidden = false;
      showStatus('');
      refresh();
      media = readMedia();
      renderMedia();
      if (unlockAchievements(null, false)) save();
      render();
      refreshQuotes();
      if (focusTitle) {
        byId('game-title').focus();
        if (!writeSaved(modeKey, selected)) showStatus('浏览器存储不可用，下次打开时需重新选择版本。');
      }
    }

    chooser.querySelectorAll('[data-version]').forEach((button) => {
      button.addEventListener('click', () => enterMode(button.dataset.version, true));
    });
    byId('switch-version').addEventListener('click', () => {
      endPhotoPlacement(false);
      viewRevision++;
      mode = '';
      version = null;
      clearTimeout(midnightTimer);
      pausePlayers(effectPool);
      pausePlayers(pinchPool);
      resetVoice();
      closePhotoDialog(false);
      resetCombo();
      clearTimeout(toastTimer);
      toastTimer = null;
      notices.length = 0;
      toast.hidden = true;
      closePoster();
      togglePanel('settings', false);
      togglePanel('achievements', false);
      stage.classList.remove('patting');
      stage.querySelectorAll('.float, .reaction, .combo-line').forEach((item) => item.remove());
      game.querySelectorAll('.reaction-rain').forEach((item) => item.remove());
      hideQuoteBubble();
      setQuoteEditor(false);
      showQuoteStatus('');
      delete document.body.dataset.skin;
      delete document.body.dataset.palette;
      document.body.style.removeProperty('--accent');
      document.body.style.removeProperty('--accent-ink');
      document.querySelector('meta[name="theme-color"]').content = '#291913';
      game.hidden = true;
      chooser.hidden = false;
      byId('chooser-title').focus();
    });

    window.addEventListener('storage', (event) => {
      if (!version) return;
      if (event.key === version.key || event.key === null) {
        refresh();
        render();
      }
      if (event.key === version.key + '-media' || event.key === null) {
        media = readMedia();
        renderMedia();
      }
      if (event.key === version.key + '-quotes' || event.key === null) refreshQuotes();
      if (event.key === version.key + '-interaction' || event.key === null) {
        applyInteraction(readSaved(version.key + '-interaction'));
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && version) {
        refresh();
        render();
      }
    });
    enterMode(readSaved(modeKey));
    if (!version) { preloadEffects(defaultAudio); preloadPinch(); }
  </script>
</body>
</html>
